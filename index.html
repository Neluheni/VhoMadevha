<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTENAL LEADS</title>
    <style>
        /* Basic Reset */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container to center the iframe */
        .iframe-container {
            width: 90%;
            max-width: 900px;
            height: 80vh;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            background-color: #fff;
        }

        /* Style for iframe to make it responsive */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        /* Title styling */
        .iframe-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <div class="iframe-title">Form Submission</div>
        <iframe 
            src="https://forms.office.com/Pages/ResponsePage.aspx?id=bLK-ScNa6kWS-ZCx8jjJn_QceXsE0gtOio-OKWO709FUMFdROFpITUk5NEdCSENDVjdGSUpGUEhFMS4u&embed=true" 
            frameborder="0" 
            marginwidth="0" 
            marginheight="0" 
            style="border: none; max-width:100%; max-height:100vh" 
            allowfullscreen webkitallowfullscreen mozallowfullscreen msallowfullscreen>
        </iframe>
    </div>

</body>
</html>
